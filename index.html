<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kindred Review</title>
<!--
  Kindred's review page: approve stories, circle requests, and members' first circle posts.
  Sign in with a reviewer account (see supabase/migrations/20261112000021_admin_review.sql). The page
  holds only the publishable key the app ships with; the database checks that you're a reviewer.
  Open it with ?demo to try it with sample items and no account.
-->
<style>
  :root {
    --paper: #f5f0e8; --card: #fff; --text: #1f1d1a; --muted: #6f6a62; --line: #e6dfd3;
    --fill: #e9e2d8; --accent: #2f4a3e; --accent-soft: #e3ebe6; --on-accent: #fff; --warm: #c2643f; --warm-soft: #f6e6de;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0e0d0c; --card: #1c1a18; --text: #f1ede6; --muted: #a59f95; --line: #2e2a26;
      --fill: #36322e; --accent: #8cb89e; --accent-soft: #1f2d26; --on-accent: #10201a; --warm: #e38c6b; --warm-soft: #3a2620;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 64px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font: 600 32px/1.15 "New York", Georgia, serif; margin: 0; margin-right: auto; }
  .serif { font-family: "New York", Georgia, serif; }
  .muted { color: var(--muted); font-size: 14px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 8px 16px;
           font-size: 14px; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--accent); color: var(--on-accent); }
  .quiet { background: transparent; color: var(--muted); padding: 8px 10px; }
  .reject { background: var(--fill); color: var(--text); }
  .link { background: none; color: var(--accent); padding: 0; font-weight: 500; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }
  .tab { background: var(--fill); color: var(--text); font-weight: 500; }
  .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600;
                               box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
  .count { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 999px;
           background: var(--warm); color: #fff; font-size: 12px; line-height: 20px; text-align: center; }
  .count.zero { background: transparent; color: var(--muted); }
  .card { background: var(--card); border-radius: 18px; padding: 16px 18px; margin: 12px 0; }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .meta b { color: var(--text); font-weight: 600; }
  .title { font: 600 20px/1.3 "New York", Georgia, serif; margin: 8px 0 4px; }
  .body { white-space: pre-wrap; margin: 6px 0 0; }
  .prompt { font: 600 14px/1.4 "New York", Georgia, serif; color: var(--accent); margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: var(--fill); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .tag { background: var(--warm-soft); color: var(--warm); border-radius: 999px; padding: 1px 8px; font-size: 12px;
         font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .actions .spacer { flex: 1; }
  textarea, input { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
                    background: var(--paper); color: var(--text); }
  textarea { min-height: 64px; margin-top: 10px; resize: vertical; }
  .empty { text-align: center; padding: 36px 16px; color: var(--muted); }
  .empty .serif { color: var(--text); font-size: 18px; display: block; margin-bottom: 4px; }
  .signin { max-width: 380px; margin: 10vh auto 0; }
  .signin label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  .signin button { width: 100%; margin-top: 16px; padding: 11px; }
  .error { color: var(--warm); font-size: 14px; margin-top: 10px; min-height: 1em; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text);
           color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0;
           transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="signin" class="signin" hidden>
    <h1>Kindred Review</h1>
    <p class="muted">For Kindred's reviewers. Sign in with your reviewer account.</p>
    <form id="signin-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Sign in</button>
      <div class="error" id="signin-error"></div>
    </form>
  </section>

  <section id="app" hidden>
    <header>
      <h1>Review</h1>
      <span class="muted" id="who"></span>
      <button class="quiet" id="refresh">Refresh</button>
      <button class="quiet" id="signout">Sign out</button>
    </header>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="stories">Stories<span class="count" id="n-stories">0</span></button>
      <button class="tab" role="tab" data-tab="requests">Circle requests<span class="count" id="n-requests">0</span></button>
      <button class="tab" role="tab" data-tab="posts">Circle posts<span class="count" id="n-posts">0</span></button>
    </nav>
    <div id="list"></div>
    <div class="error" id="app-error"></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://jyofkdjbthzguendjqpx.supabase.co";
// The publishable key the app ships with. Never put the secret (service role) key in this page.
const PUBLISHABLE_KEY = "sb_publishable_ZcVvFVv1glMrrvd5PfCE4w_HJsFqz8F";
const DEMO = new URLSearchParams(location.search).has("demo");

const $ = (id) => document.getElementById(id);
const db = DEMO ? null : supabase.createClient(SUPABASE_URL, PUBLISHABLE_KEY, {
  auth: { storageKey: "kindred-review", persistSession: true },
});

let queue = { stories: [], requests: [], posts: [] };
let tab = (() => { try { return localStorage.getItem("kindred-review-tab") || "stories"; } catch { return "stories"; } })();

// ---------- Words ----------

const words = {
  // Relationships and situations, as the database stores them.
  parent: "A parent", partner: "A partner", child: "A son or daughter", sibling: "A sibling",
  grandparent: "A grandparent", friend: "A friend", other: "Someone close",
  activeUse: "still using", seekingTreatment: "looking for treatment", inTreatment: "in treatment",
  earlyRecovery: "early recovery", longRecovery: "long-term recovery", relapse: "recently relapsed",
  incarcerated: "incarcerated", estranged: "estranged", loss: "after a loss",
  opioids: "Opioids", alcohol: "Alcohol", stimulants: "Stimulants", cannabis: "Cannabis",
  multiple: "More than one substance", unsure: "Substance not sure",
};
// Story topics. ("relapse" is both a topic and a situation, so topics get their own words.)
const topicWords = {
  relapse: "Relapse", boundaries: "Setting boundaries", enabling: "Helping vs. enabling", treatment: "Finding treatment",
  medication: "Addiction medications", money: "Money and legal issues", selfCare: "Taking care of me",
  kids: "Kids and siblings", naloxone: "Overdose safety", trust: "Rebuilding trust",
  faith: "Faith and meaning", grief: "Grief",
};
const topic = (key) => topicWords[key] || key;
const say = (key) => words[key] || (key ? String(key).replace(/([A-Z])/g, " $1").toLowerCase() : "");
const ago = (iso) => {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 60) return `${Math.max(mins, 1)} min ago`;
  if (mins < 60 * 24) return `${Math.round(mins / 60)} hr ago`;
  return `${Math.round(mins / 1440)} days ago`;
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const day = (iso) => new Date(iso + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}

// ---------- Data ----------

async function load() {
  $("app-error").textContent = "";
  if (DEMO) { render(); return; }
  const { data, error } = await db.rpc("admin_queue");
  if (error) {
    $("app-error").textContent = error.message.includes("not allowed")
      ? "This account isn't a reviewer. Add it to the admins table in Supabase, then refresh."
      : `Couldn't load the queue: ${error.message}`;
    queue = { stories: [], requests: [], posts: [] };
  } else {
    queue = data;
  }
  render();
}

async function act(kind, item, decision, note) {
  if (!DEMO) {
    const call = kind === "stories" ? db.rpc("admin_review_story", { story: item.id, decision, note: note || null })
      : kind === "requests" ? db.rpc("admin_decide_circle_request", { circle: item.circle_id, member: item.member_id, accept: decision === "approved" })
      : db.rpc("admin_review_circle_post", { post: item.id, decision });
    const { error } = await call;
    if (error) { toast(`Didn't save: ${error.message}`); return false; }
  }
  queue[kind] = queue[kind].filter((x) => x !== item);
  render();
  const done = kind === "requests" ? (decision === "approved" ? "Let in" : "Turned down")
    : decision === "approved" ? "Approved" : "Rejected";
  toast(done);
  return true;
}

// ---------- Rendering ----------

function render() {
  for (const k of ["stories", "requests", "posts"]) {
    const n = queue[k].length;
    $(`n-${k}`).textContent = n;
    $(`n-${k}`).classList.toggle("zero", n === 0);
  }
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab));
  const list = $("list");
  list.innerHTML = "";
  const items = queue[tab];
  if (!items.length) {
    const what = { stories: "stories", requests: "requests to join a circle", posts: "circle posts" }[tab];
    list.innerHTML = `<div class="empty"><span class="serif">All caught up</span>No ${what} waiting for review.</div>`;
    return;
  }
  for (const item of items) list.appendChild(card(tab, item));
}

function card(kind, item) {
  const el = document.createElement("article");
  el.className = "card";
  if (kind === "stories") {
    el.innerHTML = `
      <div class="meta"><b>${esc(item.alias)}</b><span>${esc(say(item.relationship))} · ${esc(say(item.situation))}</span>
        <span>${ago(item.created_at)}</span>
        ${item.edited ? '<span class="tag">Edited</span>' : ""}
        ${item.approved_before ? `<span>${item.approved_before} approved before</span>` : '<span class="tag">First story</span>'}</div>
      <div class="title">${esc(item.title)}</div>
      <div class="body serif">${esc(item.body)}</div>
      ${item.topics?.length ? `<div class="chips">${item.topics.map((t) => `<span class="chip">${esc(topic(t))}</span>`).join("")}</div>` : ""}
      <textarea placeholder="Note to the writer if you reject it (optional). They'll see this." hidden></textarea>
      <div class="actions">
        <button class="primary" data-do="approved">Approve</button>
        <button class="reject" data-do="rejected">Reject…</button>
      </div>`;
    const note = el.querySelector("textarea");
    const rejectBtn = el.querySelector('[data-do="rejected"]');
    rejectBtn.addEventListener("click", async () => {
      if (note.hidden) { note.hidden = false; rejectBtn.textContent = "Reject"; note.focus(); return; }
      busy(el, true);
      if (!(await act(kind, item, "rejected", note.value.trim()))) busy(el, false);
    });
  } else if (kind === "requests") {
    const full = item.members >= item.capacity;
    el.innerHTML = `
      <div class="meta"><b>${esc(item.alias)}</b><span>asked ${ago(item.created_at)}</span></div>
      <div class="title">${esc(say(item.relationship))} · ${esc(say(item.situation))}</div>
      <div class="muted">${esc(say(item.substance))}</div>
      <div class="meta" style="margin-top:10px"><span>Wants to join <b>${esc(item.circle)}</b></span>
        <span>${item.starts_on ? `starts ${day(item.starts_on)} · ${item.weeks} weeks` : ""}</span>
        <span>${item.members} of ${item.capacity} joined</span>${full ? '<span class="tag">Full</span>' : ""}</div>
      <div class="actions">
        <button class="primary" data-do="approved" ${full ? "disabled" : ""}>Let them in</button>
        <button class="reject" data-do="rejected">Turn down</button>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="meta"><b>${esc(item.alias || "A former member")}</b><span>in ${esc(item.circle)}</span>
        <span>${ago(item.created_at)}</span>${item.is_reply ? '<span class="tag">Reply</span>' : ""}</div>
      ${item.prompt ? `<div class="prompt">${esc(item.prompt)}</div>` : ""}
      <div class="body">${esc(item.body)}</div>
      <div class="actions">
        <button class="primary" data-do="approved">Approve</button>
        <button class="reject" data-do="rejected">Reject</button>
      </div>`;
  }
  el.querySelectorAll("button[data-do]").forEach((b) => {
    if (kind === "stories" && b.dataset.do === "rejected") return;
    b.addEventListener("click", async () => {
      busy(el, true);
      if (!(await act(kind, item, b.dataset.do))) busy(el, false);
    });
  });
  return el;
}

function busy(el, on) { el.querySelectorAll("button").forEach((b) => (b.disabled = on)); }

// ---------- Signing in ----------

async function show(session) {
  const signedIn = DEMO || !!session;
  $("signin").hidden = signedIn;
  $("app").hidden = !signedIn;
  if (!signedIn) return;
  $("who").textContent = DEMO ? "Sample items · nothing is saved" : session.user.email;
  $("signout").hidden = DEMO;
  await load();
}

$("signin-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("signin-error").textContent = "";
  const { data, error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) { $("signin-error").textContent = error.message; return; }
  $("password").value = "";
  show(data.session);
});
$("signout").addEventListener("click", async () => { await db.auth.signOut(); show(null); });
$("refresh").addEventListener("click", async () => { await load(); toast("Up to date"); });
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  try { localStorage.setItem("kindred-review-tab", tab); } catch {}
  render();
}));

if (DEMO) {
  const h = (n) => new Date(Date.now() - n * 3600e3).toISOString();
  queue = {
    stories: [
      { id: "s1", alias: "Quiet Harbor", relationship: "parent", situation: "earlyRecovery", created_at: h(3), edited: false, approved_before: 0,
        title: "The first boundary I kept", topics: ["boundaries", "selfCare"],
        body: "For months I said yes to every late-night call. Last week I told my son I'd talk in the morning, and I meant it. I didn't sleep much, but I kept it, and he called at nine." },
      { id: "s2", alias: "Gentle Oak", relationship: "partner", situation: "relapse", created_at: h(26), edited: true, approved_before: 2,
        title: "Relapse isn't the end of the story", topics: ["relapse", "trust"],
        body: "When he started again after eight months, I thought everything we'd built was gone. My group reminded me that recovery isn't a straight line." },
    ],
    requests: [
      { circle_id: "c1", member_id: "m1", circle: "Parents, early recovery", starts_on: "2026-11-16", weeks: 4, capacity: 15, members: 11,
        alias: "Hopeful Lantern", relationship: "parent", situation: "earlyRecovery", substance: "opioids", created_at: h(5) },
    ],
    posts: [
      { id: "p1", circle: "Parents, early recovery", alias: "Steady Willow", created_at: h(1), is_reply: false,
        prompt: "What's one limit you held, and how did it feel?", body: "I said no to paying for his phone. It felt awful for a day, then it felt right." },
    ],
  };
  show(null);
} else {
  db.auth.getSession().then(({ data }) => show(data.session));
}
</script>
</body>
</html>
